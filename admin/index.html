<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Pesantren Kampung Santri</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Admin Dashboard</h1>
      <div>
        <span id="user-info"></span>
        <button id="logout" type="button" hidden>Logout</button>
      </div>
    </header>

    <div id="login-screen" class="login-screen">
      <h2>Masuk dengan GitHub Personal Access Token</h2>
      <p>Token disimpan di browser ini saja. Gunakan HTTPS.</p>
      <input id="token-input" type="password" placeholder="ghp_..." autocomplete="off">
      <button id="login-btn" type="button">Login</button>
      <p id="login-error" class="error"></p>
      <p><a href="https://github.com/settings/tokens" target="_blank" rel="noopener">Buat token di GitHub</a></p>
    </div>

    <div id="main-screen" class="main-screen" hidden>
      <aside class="sidebar" id="sidebar"></aside>
      <main class="workspace" id="workspace"></main>
    </div>
  </div>

  <div id="media-modal" class="modal" hidden>
    <div class="modal-content">
      <h3>Pilih Gambar</h3>
      <div id="media-list"></div>
      <br>
      <button id="close-media" type="button">Tutup</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="js/github.js"></script>
  <script src="js/jekyll.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
