<section id="brosur" class="bg-light-gray">
<div class="container">
  {% assign brochure = page.brosur.items %}
  {% for item in brochure %}
  <div class="row" style="padding-bottom:90px">
    <div class="col-lg-12 text-center">
      <h2 class="section-heading">{{ item.title }}</h2>
      <h3 class="section-subheading text-muted">{{ item.comment }}</h3>
    </div>
    <div class="col-lg-12 text-center">
      <iframe src="{{ item.url }}" width="100%" height="540 px" allow="autoplay"></iframe>
    </div>
  </div>
  {% endfor %}
</div>
</section>
